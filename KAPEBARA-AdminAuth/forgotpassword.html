<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapebara - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .logo {
            width: 300px;
            margin-bottom: 20px;
        }

        .page-header {
            font-size: 48px;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 50px;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            text-align: center;
        }

        .forgot-form {
            width: 100%;
            max-width: 420px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #3d3d3d;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            color: #3d3d3d;
            background-color: white;
            transition: border-color 0.3s;
        }

        .form-group input::placeholder {
            color: #a0a0a0;
        }

        .form-group input:focus {
            outline: none;
            border-color: #7a7a7a;
        }

        .submit-btn {
            width: 50%;
            padding: 10px;
            background-color: #3d3d3d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            margin: 50px auto 0 auto;
            display: block;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #2d2d2d;
        }

        @media (max-width: 768px) {
            .logo {
                width: 220px;
                margin-bottom: 40px;
            }

            .page-header {
                font-size: 32px;
                margin-bottom: 30px;
            }

            .submit-btn {
                width: 70%;
            }
        }
    </style>
</head>
<body>
    <img src="kapebara logo.png" alt="Kapebara Logo" class="logo">
    
    <h1 class="page-header">Forgot Password</h1>
    
    <form class="forgot-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email..." required>
        </div>

        <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" placeholder="Enter your new password..." required>
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Confirm your password..." required>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
    </form>
</body>
</html>
