<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapebara - Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: white;
            min-height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .logo {
            position: center;
            top: 20px;
            left: 60px;
            width: 280px;
            margin-bottom: 40px;
        }

        .capybara-image {
            width: 400px;
            max-width: 90%;
        }

        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .login-header {
            font-size: 48px;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }

        .welcome-text {
            font-size: 24px;
            font-weight: 700;
            color: #2d2d2d;
            margin-bottom: 8px;
        }

        .form-info {
            font-size: 14px;
            color: #5a5a5a;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .login-form {
            width: 100%;
            max-width: 420px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #3d3d3d;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'DM Sans', sans-serif;
            color: #3d3d3d;
            background-color: white;
            transition: border-color 0.3s;
        }

        .form-group input::placeholder {
            color: #a0a0a0;
        }

        .form-group input:focus {
            outline: none;
            border-color: #7a7a7a;
        }

        .submit-btn {
            width: 45%;
            padding: 8px;
            background-color: #3d3d3d;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            margin: 50px auto 0 auto;
            display: block;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #2d2d2d;
        }

        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }

        .forgot-password a {
            color: #d0d0d0;
            text-decoration: underline;
            font-size: 15px;
            font-weight: 500;
        }

        .forgot-password a:hover {
            color: #b0b0b0;
        }

        .rider-login {
            text-align: center;
            margin-top: 30px;
            font-size: 16px;
            color: #3d3d3d;
            font-weight: 700;
        }

        .rider-login a {
            color: #6b6b6b;
            text-decoration: none;
            font-weight: 700;
        }

        .rider-login a:hover {
            text-decoration: underline;
        }

        @media (max-width: 968px) {
            .container {
                flex-direction: column;
            }

            .logo {
                position: relative;
                top: 0;
                left: 0;
                margin-bottom: 30px;
            }

            .left-section {
                padding: 30px 20px;
            }

            .capybara-image {
                width: 300px;
            }

            .login-header {
                font-size: 36px;
                margin-bottom: 20px;
            }

            .welcome-text {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-section">
            <img src="kapebara logo.png" alt="Kapebara Logo" class="logo">
            <img src="capybara.png" alt="Capybara sipping drink" class="capybara-image">
        </div>

        <div class="right-section">
            <h1 class="login-header">LOG IN</h1>
            <h2 class="welcome-text">Welcome back, [Name]!</h2>
            <p class="form-info">You are logging in as an Admin.</p>
            
            <form class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email address..." required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password..." required>
                </div>

                <button type="submit" class="submit-btn">Submit</button>

                <div class="forgot-password">
                    <a href="forgotpassword.html">Forgot Password</a>
                </div>

                <div class="rider-login">
                    <p>Log in as rider instead? <a href="rider-login.html">Click here.</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
